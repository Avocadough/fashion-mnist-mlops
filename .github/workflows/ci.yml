name: CI
on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  lint-test-and-artifacts:
    runs-on: ubuntu-latest

    env:
      # ปิด proxy artifacts ของ MLflow เผื่อบางเวอร์ชันมอง env นี้
      MLFLOW_ENABLE_ARTIFACTS_PROXY: "false"

    steps:
      - name: Checkout
      # ทำงานที่ root ของ repo (ค่า default)
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "setuptools<81" pytest flake8 httpx

      - name: Lint (flake8)
        run: |
          flake8 scripts app --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 scripts app --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      # Step 1 (tiny): จะสร้าง MLflow run และ artifacts/reports/validation.json
      - name: Step 1 - Data Validation (tiny)
        run: |
          python scripts/1_data_validation.py --tiny

      # กันกรณี --tiny ของคุณยังไม่เขียน CSV: เขียน CSV จิ๋วให้ preprocessing ใช้ต่อ
      - name: Ensure tiny CSV for preprocessing
        run: |
          python - << 'PY'
          import pathlib, numpy as np, pandas as pd
          ART = pathlib.Path("artifacts"); ART.mkdir(parents=True, exist_ok=True)
          csv = ART / "fashion_mnist.csv"
          if not csv.exists():
              d = 784
              rng = np.random.default_rng(42)
              X = rng.integers(0, 256, size=(300, d), dtype=np.uint16)
              y = rng.integers(0, 10, size=(300, 1), dtype=np.int8)
              cols = [f"px{i}" for i in range(d)] + ["label"]
              pd.DataFrame(np.hstack([X, y]), columns=cols).to_csv(csv, index=False)
              print("[CI] wrote", csv)
          else:
              print("[CI] reuse", csv)
          PY

      - name: Step 2 - Preprocessing
        run: |
          python scripts/2_data_preprocessing.py

      - name: Run unit tests (exclude e2e)
        run: |
          python -m pytest -q -m "not e2e" --maxfail=1 --disable-warnings

      # แสดง tree ของ mlruns ใน log เพื่อยืนยันว่าถูกสร้าง
      - name: Show mlruns tree
        run: |
          python - << 'PY'
          import os, pathlib
          p = pathlib.Path("mlruns")
          print("mlruns exists?", p.exists())
          if p.exists():
              for root, dirs, files in os.walk("mlruns"):
                  if files:
                      print(root, "files:", len(files))
          PY

      # อัปโหลด mlruns เป็น artifact เพื่อให้ดาวน์โหลดได้จากหน้า workflow
      - name: Upload mlruns artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlruns-${{ github.run_id }}
          path: mlruns/
          if-no-files-found: warn
          retention-days: 7
