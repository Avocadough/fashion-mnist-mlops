name: CI
on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "setuptools<81" pytest flake8 httpx

      - name: Lint (flake8)
        run: |
          flake8 scripts app --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 scripts app --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      # Step 1 (tiny) เพื่อให้มี mlruns/**/reports/validation.json โดยไม่ต้องโหลด 70k จริง
      - name: Step 1 - Data Validation (tiny)
        run: |
          python scripts/1_data_validation.py --tiny

      # Step 2 เพื่อสร้าง artifacts/splits/*.csv (สเกล 0..1)
      - name: Step 2 - Preprocessing
        run: |
          python scripts/2_data_preprocessing.py

      - name: Run unit tests (exclude e2e)
        env:
          MLFLOW_ENABLE_ARTIFACTS_PROXY: "false"
        run: |
          python -m pytest -q -m "not e2e" --maxfail=1 --disable-warnings
