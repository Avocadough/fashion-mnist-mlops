name: CI
on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements ของโปรเจกต์ + ลด warning จาก pkg_resources/distutils
          pip install -r requirements.txt "setuptools<81"

      - name: Prepare lightweight test artifacts (no big downloads)
        env:
          # ใช้ MLflow แบบไฟล์โลคัล เพื่อไม่เรียกเซิร์ฟเวอร์
          MLFLOW_TRACKING_URI: file:./mlruns
        run: |
          python - << 'PY'
          import os, pathlib, pandas as pd, numpy as np

          # เตรียมโครงสร้าง artifacts/splits แบบจิ๋วให้ pytest ใช้
          ARTIFACTS = pathlib.Path("artifacts")
          SPLITS = ARTIFACTS / "splits"
          SPLITS.mkdir(parents=True, exist_ok=True)

          n_features = 784
          cols = [f"px{i}" for i in range(n_features)] + ["label"]

          rng = np.random.default_rng(42)
          def make_df(n):
              X = rng.random((n, n_features), dtype=np.float32)  # 0..1
              y = rng.integers(0, 10, size=(n, 1), dtype=np.int8)
              arr = np.hstack([X, y])
              return pd.DataFrame(arr, columns=cols)

          # ชุดเล็กพอให้เทสต์รันผ่านไว (รวม 300 แถว)
          train = make_df(240)
          val   = make_df(30)
          test  = make_df(30)

          ARTIFACTS.mkdir(parents=True, exist_ok=True)
          # (เผื่อเทสต์บางไฟล์อ่านทั้งก้อน)
          small_full = pd.concat([train, val, test], ignore_index=True)
          small_full.to_csv(ARTIFACTS / "fashion_mnist.csv", index=False)

          train.to_csv(SPLITS / "train.csv", index=False)
          val.to_csv(SPLITS / "val.csv", index=False)
          test.to_csv(SPLITS / "test.csv", index=False)

          print("[CI] Prepared tiny artifacts in artifacts/ and artifacts/splits/")
          PY

      - name: Run unit tests
        env:
          # กันโค้ดไปชี้ server ที่ไม่มีใน CI
          MLFLOW_TRACKING_URI: file:./mlruns
          MLFLOW_ARTIFACTS_URI: ""
          MLFLOW_ENABLE_ARTIFACTS_PROXY: "false"
        run: |
          pytest -q
