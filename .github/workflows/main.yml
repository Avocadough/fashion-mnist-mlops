# เพิ่มอีก job ใน .github/workflows/ci.yml
e2e-api:
  needs: lint-and-test
  runs-on: ubuntu-latest
  env:
    MLFLOW_TRACKING_URI: file:./mlruns
  steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with: { python-version: "3.11" }
    - name: Install deps
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt "setuptools<81>" httpx uvicorn
    - name: Prepare tiny deploy model
      run: |
        python - << 'PY'
        import tempfile, mlflow.pyfunc, numpy as np, pathlib, shutil
        class D(mlflow.pyfunc.PythonModel):
            def predict(self, context, X): return np.zeros((len(X),), dtype=int)
        tmp = tempfile.mkdtemp()
        mlflow.pyfunc.save_model(path=tmp, python_model=D())
        dst = pathlib.Path("artifacts/deploy/fashion_mnist_clf")
        shutil.rmtree(dst, ignore_errors=True); dst.parent.mkdir(parents=True, exist_ok=True)
        shutil.copytree(tmp, dst)
        print("[E2E] tiny deploy model ready at", dst)
        PY
    - name: Start API in background
      run: |
        uvicorn app.main:app --host 127.0.0.1 --port 8080 &
        echo $! > uvicorn.pid
        sleep 2
    - name: Call /health and /predict
      run: |
        python - << 'PY'
        import requests, json
        r = requests.get("http://127.0.0.1:8080/health", timeout=10); r.raise_for_status()
        pixels = [0.0]*784
        r2 = requests.post("http://127.0.0.1:8080/predict", json={"pixels": pixels}, timeout=10); r2.raise_for_status()
        print("health:", r.json()); print("predict:", r2.json())
        PY
    - name: Stop API
      if: always()
      run: |
        kill $(cat uvicorn.pid) || true
