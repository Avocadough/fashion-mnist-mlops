name: CI
on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "setuptools<81" pytest

      - name: Prepare lightweight test artifacts (no big downloads)
        env:
          MLFLOW_TRACKING_URI: file:./mlruns
        run: |
          python - << 'PY'
          import os, pathlib, pandas as pd, numpy as np
          ARTIFACTS = pathlib.Path("artifacts"); SPLITS = ARTIFACTS/"splits"
          SPLITS.mkdir(parents=True, exist_ok=True)
          n_features = 784
          cols = [f"px{i}" for i in range(n_features)] + ["label"]
          rng = np.random.default_rng(42)
          def make_df(n):
              X = rng.random((n, n_features), dtype=np.float32)
              y = rng.integers(0, 10, size=(n, 1), dtype=np.int8)
              return pd.DataFrame(np.hstack([X, y]), columns=cols)
          train, val, test = make_df(240), make_df(30), make_df(30)
          ARTIFACTS.mkdir(exist_ok=True)
          pd.concat([train, val, test], ignore_index=True).to_csv(ARTIFACTS/"fashion_mnist.csv", index=False)
          train.to_csv(SPLITS/"train.csv", index=False)
          val.to_csv(SPLITS/"val.csv", index=False)
          test.to_csv(SPLITS/"test.csv", index=False)
          print("[CI] tiny artifacts ready")
          PY

      - name: Run unit tests
        env:
          MLFLOW_TRACKING_URI: file:./mlruns
          MLFLOW_ARTIFACTS_URI: ""
          MLFLOW_ENABLE_ARTIFACTS_PROXY: "false"
        run: |
          python -m pytest -q
