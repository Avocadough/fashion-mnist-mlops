# ML Project — Fashion-MNIST MLOps Workflow (MLflow + FastAPI)

เวิร์กโฟลว์ครบ 4 ขั้นตอนสำหรับงานรายวิชา:
1) **Data Validation** (รวม Anomaly detection)  
2) **Data Preprocessing** (สเกล 0..1 + แบ่ง train/val/test)  
3) **Model Training** (หลายรัน: PCA → LogisticRegression)  
4) **Model Evaluation & Export** (เลือก best → ประเมินบน test → เซฟสำหรับเสิร์ฟ)  
จากนั้น **Serve API ด้วย FastAPI** และ **ทดสอบการพยากรณ์จริง**

- **Public dataset:** Fashion-MNIST (**70,000 แถว**, 10 คลาส)  
  โหลดผ่าน `sklearn.fetch_openml("Fashion-MNIST", version=1)` ครั้งแรกเท่านั้น แล้วแคชเป็น `artifacts/fashion_mnist.csv`
- **MLflow:** ใช้ **local file store** (`./mlruns`) — ไม่ต้องเปิด MLflow server

---

## 0) เตรียมสภาพแวดล้อม (Conda)

`environment.yml` (มีในโปรเจกต์):
```yaml
name: mlflow-fashion
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - numpy=1.26
  - pandas=2.2
  - scikit-learn=1.5
  - scipy
  - uvicorn=0.30
  - pytest=8.3
  - pip:
      - mlflow==2.14.1
      - fastapi==0.115.0
      - pydantic==2.9.2
      - requests>=2.32
      - "setuptools<81"
สร้างและเปิดใช้ env (Windows PowerShell/CMD):

bat
Copy code
conda env remove -n mlflow-fashion -y  ^  &&  ^
conda env create -f environment.yml     ^  &&  ^
conda activate mlflow-fashion           ^  &&  ^
python -m pip install --upgrade pip
เคลียร์ตัวแปร MLflow ที่อาจค้างจากรอบก่อน (กันชนกับ server/proxy):

bat
Copy code
set MLFLOW_TRACKING_URI=
set MLFLOW_ARTIFACTS_URI=
set MLFLOW_ENABLE_ARTIFACTS_PROXY=
1) Data Validation (ดึง Fashion-MNIST 70,000 + รายงาน + Anomaly detection)
สคริปต์จะบังคับ MLflow ไปที่ file:///.../mlruns โดยอัตโนมัติ

bat
Copy code
python scripts\1_data_validation.py
ผลลัพธ์:

artifacts/fashion_mnist.csv (70k แถว)

รายงาน mlruns/**/artifacts/reports/validation.json (มี anomalies/outliers/duplicates ฯลฯ)

เดโมเร็ว (CI/ออฟไลน์) ใช้โหมดเล็ก:

bat
Copy code
python scripts\1_data_validation.py --tiny
