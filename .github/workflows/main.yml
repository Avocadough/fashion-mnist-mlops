name: CI
on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "setuptools<81" pytest

      - name: Prepare lightweight test artifacts (no big downloads)
        env:
          MLFLOW_TRACKING_URI: file:./mlruns
        run: |
          python - << 'PY'
          import pathlib, numpy as np, pandas as pd
          ART = pathlib.Path("artifacts"); SPL = ART/"splits"
          SPL.mkdir(parents=True, exist_ok=True)
          n, d = 60, 784
          cols = [f"px{i}" for i in range(d)] + ["label"]
          rng = np.random.default_rng(42)
          def mk(m): 
              X = rng.random((m,d), dtype=np.float32)
              y = rng.integers(0,10,size=(m,1),dtype=np.int8)
              return pd.DataFrame(np.hstack([X,y]), columns=cols)
          train, val, test = mk(40), mk(10), mk(10)
          ART.mkdir(exist_ok=True)
          pd.concat([train,val,test]).to_csv(ART/"fashion_mnist.csv", index=False)
          train.to_csv(SPL/"train.csv", index=False)
          val.to_csv(SPL/"val.csv", index=False)
          test.to_csv(SPL/"test.csv", index=False)
          print("[CI] tiny artifacts ready")
          PY

      - name: Run unit tests (skip HTTP e2e test)
        env:
          MLFLOW_TRACKING_URI: file:./mlruns
          MLFLOW_ENABLE_ARTIFACTS_PROXY: "false"
        run: |
          python -m pytest -q --ignore=scripts/test_api.py --maxfail=1 --disable-warnings
