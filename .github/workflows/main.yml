5) (ตัวเลือก) เปิด MLflow UI แสดงผลการทดลอง
bat
Copy code
mlflow ui --host 0.0.0.0 --port 5000
เปิดเบราว์เซอร์: http://127.0.0.1:5000
(โชว์ experiments, metrics, confusion matrix, artifacts)

6) Serve API (FastAPI + Uvicorn)
เปิดเซิร์ฟเวอร์:

bat
Copy code
uvicorn app.main:app --host 0.0.0.0 --port 8080
ตรวจสุขภาพ:

bat
Copy code
curl http://127.0.0.1:8080/health
ทดสอบพยากรณ์ (single)
สร้างสคริปต์เล็ก:

python
Copy code
# scripts/test_api.py
import requests, pandas as pd
df = pd.read_csv("artifacts/splits/test.csv")
row = df.iloc[0]
pixels = row.drop("label").astype(float).tolist()   # 784 ค่า (0..1)
r = requests.post("http://127.0.0.1:8080/predict", json={"pixels": pixels}, timeout=30)
print("true_label:", int(row["label"]))
print("response:", r.json())
รัน:

bat
Copy code
python scripts\test_api.py
API รองรับ autoscale หากส่งค่า 0..255 — เพื่อป้องกัน training–serving skew

7) (ตัวเลือก) รัน CI/Unit Tests แบบเบา (เหมือน GitHub Actions)
ติดตั้ง dev tools:

bat
Copy code
pip install pytest flake8 httpx
รันเทสต์ (ข้าม e2e ที่ยิง HTTP จริง):

bat
Copy code
python -m pytest -q --ignore=scripts/test_api.py --maxfail=1 --disable-warnings
โปรเจกต์มี unit test สำหรับ API แบบใช้ TestClient (ไม่ต้องเปิดพอร์ต),
และเทสต์ preprocessing/validation อย่างน้อย 3 เคส ตามข้อกำหนดรายวิชา

